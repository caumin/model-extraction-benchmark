run:
  name: repro_2021_gong_inversenet_smoke2k_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: "1.2"

victim:
  victim_id: mnist_classifier
  arch: classifier
  dropout_prob: 0.2
  channels: 1
  num_classes: 10
  input_size: [28, 28]
  checkpoint_ref: runs/victims/mnist_classifier_seed0.pt
  output_mode: hard_top1
  temperature: 1.0

dataset:
  name: MNIST
  data_mode: surrogate
  surrogate_name: EMNIST
  surrogate_split: letters
  surrogate_max_samples: 20000
  surrogate_subset_seed: 42
  num_workers: 0
  train_split: true
  channels: 1
  input_size: [28, 28]

attack:
  name: inversenet
  output_mode: hard_top1
  max_budget: 2000
  batch_size: 64
  pool_cache_max_samples: 20000
  phase_ratios: [0.45, 0.45, 0.1]
  truncation_k: 1
  coreset_seed: 20
  hcss_xi: 0.02
  hcss_max_iter: 10

substitute:
  arch: cnn32
  init_seed: 1234
  batch_size: 64
  num_workers: 0
  train_num_workers: 0
  val_num_workers: 0
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  max_epochs: 5
  patience: 2

budget:
  max_budget: 2000
  checkpoints: [200, 600, 1000, 1400, 1800, 2000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
