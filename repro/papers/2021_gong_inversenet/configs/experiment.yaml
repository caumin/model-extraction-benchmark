run:
  name: repro_2021_gong_inversenet_full30k_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: "1.2"

victim:
  victim_id: mnist_classifier
  arch: classifier
  dropout_prob: 0.2
  channels: 1
  num_classes: 10
  input_size: [28, 28]
  checkpoint_ref: runs/victims/mnist_classifier_seed0.pt
  output_mode: hard_top1
  temperature: 1.0

dataset:
  name: MNIST
  data_mode: surrogate
  surrogate_name: EMNIST
  surrogate_split: letters
  num_workers: 0
  train_split: true
  channels: 1
  input_size: [28, 28]

attack:
  name: inversenet
  output_mode: hard_top1
  max_budget: 30000
  batch_size: 128
  phase_ratios: [0.45, 0.45, 0.1]
  truncation_k: 1
  coreset_seed: 20
  hcss_xi: 0.02
  hcss_max_iter: 20

substitute:
  arch: cnn32
  init_seed: 1234
  batch_size: 128
  num_workers: 0
  train_num_workers: 0
  val_num_workers: 0
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  max_epochs: 200
  patience: 20

budget:
  max_budget: 30000
  checkpoints: [1000, 5000, 10000, 15000, 20000, 25000, 30000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
