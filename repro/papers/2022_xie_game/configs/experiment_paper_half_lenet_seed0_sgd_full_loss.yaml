run:
  name: repro_2022_xie_game_paper_pair1_half_lenet_8k_seed0_sgd_full_loss
  seeds:
  - 0
  device: cuda:0
benchmark:
  protocol_version: '1.2'
victim:
  victim_id: mnist_lenet32_tanh_game_paper
  arch: lenet
  channels: 1
  num_classes: 10
  input_size:
  - 32
  - 32
  checkpoint_ref: runs/victims/mnist_lenet32_tanh_game_paper.pt
  output_mode: soft_prob
  temperature: 1.0
  normalization: null
dataset:
  name: MNIST
  data_mode: data_free
  channels: 1
  input_size:
  - 32
  - 32
attack:
  name: game
  output_mode: soft_prob
  max_budget: 8000
  batch_size: 1024
  querybudget: 8000
  attack_train_epoch: 40
  final_retrain_epoch_offset: 10
  round_train_epochs: 20
  train_on_full_buffer: true
  optimizer: sgd
  acs_strategy: random
  use_acgan: true
  tdl_steps: 20
  agu_steps: 2
  agu_loss_terms:
  - res
  - bou
  - adv
  - dif
  gmd_steps: 1
  noise_dim: 100
  student_lr: 0.1
  generator_lr: 0.0002
  discriminator_lr: 0.0002
  eval_interval_queries: 1000
  proxy_dataset:
    name: MNIST
    data_mode: surrogate
    surrogate_name: FashionMNIST
    channels: 1
    input_size:
    - 32
    - 32
    num_workers: 0
substitute:
  arch: half_lenet
  width_mult: 1
  init_seed: 0
  batch_size: 1024
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
budget:
  max_budget: 8000
  checkpoints:
  - 1000
  - 2000
  - 3000
  - 4000
  - 5000
  - 6000
  - 7000
  - 8000
cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
