attack:
  name: game
  output_mode: soft_prob
  max_budget: 8000
  batch_size: 1024
  querybudget: 8000
  attack_train_epoch: 40
  final_retrain_epoch_offset: 10
  round_train_epochs: 20
  train_on_full_buffer: true
  optimizer: sgd
  acs_strategy: random
  use_acgan: true
  tdl_steps: 20
  agu_steps: 2
  agu_loss_terms:
  - res
  - bou
  - dif
  gmd_steps: 1
  noise_dim: 100
  student_lr: 0.002
  generator_lr: 0.0002
  discriminator_lr: 0.0002
  eval_interval_queries: 1000
substitute:
  arch: half_lenet
  width_mult: 1
  init_seed: 0
  optimizer:
    name: sgd
    lr: 0.002
    momentum: 0.9
    weight_decay: 0.0005
budget:
  max_budget: 8000
  checkpoints:
  - 1000
  - 2000
  - 3000
  - 4000
  - 5000
  - 6000
  - 7000
  - 8000
