run:
  name: repro_2022_xie_game_paper_pair2_half_alexnet_6k_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: "1.2"

victim:
  victim_id: belgiumtsc_alexnet_tanh_game_paper
  arch: alexnet
  input_scale_mode: unit
  channels: 3
  num_classes: 62
  input_size: [32, 32]
  checkpoint_ref: runs/victims/belgiumtsc_alexnet_tanh_game_paper.pt
  output_mode: soft_prob
  temperature: 1.0

dataset:
  name: BelgiumTSC
  data_mode: data_free
  channels: 3
  input_size: [32, 32]

attack:
  name: game
  output_mode: soft_prob
  num_classes: 62
  max_budget: 6000
  batch_size: 1024
  querybudget: 6000
  attack_train_epoch: 40
  final_retrain_epoch_offset: 10
  round_train_epochs: 20
  train_on_full_buffer: true
  optimizer: adam
  acs_strategy: random
  use_acgan: true
  tdl_steps: 20
  agu_steps: 2
  agu_loss_terms: [res, bou, dif]
  gmd_steps: 1
  repro_input_scale_mode: tanh
  noise_dim: 430
  student_lr: 0.1
  generator_lr: 0.0002
  discriminator_lr: 0.0002
  eval_interval_queries: 1000
  proxy_dataset:
    name: BelgiumTSC
    data_mode: surrogate
    surrogate_name: GTSRB
    surrogate_color_jitter: true
    channels: 3
    input_size: [32, 32]
    num_workers: 0
    num_classes: 43

substitute:
  arch: half_alexnet
  width_mult: 1
  init_seed: 0
  batch_size: 1024
  optimizer:
    name: adam
    lr: 0.1
    betas: [0.5, 0.999]
    momentum: 0.0
    weight_decay: 0.0

budget:
  max_budget: 6000
  checkpoints: [1000, 2000, 3000, 4000, 5000, 6000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
