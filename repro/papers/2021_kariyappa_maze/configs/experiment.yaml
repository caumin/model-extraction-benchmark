run:
  name: repro_2021_kariyappa_maze_full20m_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: "1.2"

victim:
  victim_id: cifar10_resnet34_8x_official
  arch: resnet34
  # NOTE: official `resnet34_8x` naming is legacy; implementation is standard ResNet-34 width.
  width_mult: 1
  input_scale_mode: unit
  channels: 3
  num_classes: 10
  input_size: [32, 32]
  checkpoint_ref: runs/victims/cifar10-resnet34_8x.pt
  output_mode: soft_prob
  temperature: 1.0

dataset:
  name: CIFAR10
  data_mode: data_free
  channels: 3
  input_size: [32, 32]

attack:
  name: maze
  output_mode: soft_prob
  clone_input_scale_mode: tanh
  query_input_scale_mode: tanh
  max_budget: 20000000
  batch_size: 128
  n_g_steps: 1
  n_c_steps: 5
  n_r_steps: 10
  grad_approx_m: 10
  grad_approx_epsilon: 0.001
  generator_lr: 0.0001
  generator_momentum: 0.9
  generator_weight_decay: 0.0005
  lr_schedule: cosine

substitute:
  arch: wideresnet22
  width_mult: 2
  init_seed: 1234
  batch_size: 128
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005

budget:
  max_budget: 20000000
  checkpoints: [1000, 10000, 100000, 1000000, 10000000, 20000000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
