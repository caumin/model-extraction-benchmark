attack:
  name: blackbox_ripper
  output_mode: soft_prob
  max_budget: 30000
  generator_name: cifar_progan
  generator_checkpoint: checkpoints/blackbox_ripper/official/cifar_100_6_classes_gan
  generator_output_range: tanh
  population_size: 30
  elite_size: 10
  latent_bound: 3.0
  mutation_scale: 1.0
  fitness_threshold: 0.02
  max_evolve_iters: 10
  substitute_epochs: 200
  train_batch_size: 64
  batches_per_epoch: 1000
  substitute_lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005

substitute:
  arch: resnet18
  width_mult: 1
  init_seed: 1234
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005

budget:
  max_budget: 30000
  checkpoints: [1000, 5000, 10000, 20000, 30000]
