run:
  name: repro_2021_truong_dfme_full20m_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: "1.2"

victim:
  victim_id: cifar10_resnet34_8x_official
  arch: resnet34
  width_mult: 1
  input_scale_mode: tanh
  channels: 3
  num_classes: 10
  input_size: [32, 32]
  checkpoint_ref: runs/victims/cifar10-resnet34_8x.pt
  output_mode: soft_prob
  temperature: 1.0
  return_outputs_on_cpu: false

dataset:
  name: CIFAR10
  data_mode: data_free
  channels: 3
  input_size: [32, 32]

attack:
  name: dfme
  output_mode: soft_prob
  max_budget: 20000000
  batch_size: 256
  n_g_steps: 1
  n_s_steps: 5
  grad_approx_m: 1
  grad_approx_epsilon: 0.001

substitute:
  arch: resnet18
  width_mult: 1
  init_seed: 1234
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005

budget:
  max_budget: 20000000
  checkpoints: [100000, 1000000, 5000000, 10000000, 15000000, 20000000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
