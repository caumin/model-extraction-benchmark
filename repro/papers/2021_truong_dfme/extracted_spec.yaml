paper:
  paper_id: 2021_truong_dfme
  title: Data-Free Model Extraction
  authors:
    - Jean-Baptiste Truong
    - Pratyush Maini
    - Robert J. Walls
    - Nicolas Papernot
  year: 2021
  venue: CVPR
pdf:
  path: /papers/DFME.pdf
  sha256: 91bbaa1f6ed1c68364582ba42bf3296034a0166075a98fc7c3fb99be32319e10
datasets:
  - name: SVHN
    version: standard
    task: image classification
    num_classes: 10
    splits:
      train: standard train split
      val: not specified
      test: standard test split
    preprocessing:
      input_size: 32x32
      normalize:
        mean: []
        std: []
      augmentation: []
    notes: victim and extraction benchmark dataset
  - name: CIFAR-10
    version: standard
    task: image classification
    num_classes: 10
    splits:
      train: standard train split
      val: not specified
      test: standard test split
    preprocessing:
      input_size: 32x32
      normalize:
        mean: []
        std: []
      augmentation: []
    notes: victim and extraction benchmark dataset
victim:
  framework: not specified
  architecture:
    name: ResNet-34-8x
    details: teacher/victim network in experiments
    pretrained: not specified
  training:
    loss: not explicitly specified
    optimizer:
      name: SGD
      lr: 0.1
      weight_decay: null
      momentum: null
      betas: []
    batch_size: null
    epochs: null
    scheduler: "decay by factor 10 at 50% training"
    seed: null
    num_runs: 1
attack:
  name: dfme
  oracle_access:
    type: prob
    temperature: null
    rounding: null
  query_budget:
    svhn: 2000000
    cifar10: 20000000
  substitute:
    architecture: ResNet-18-8x
    training:
      batch_size: 256
      optimizer:
        name: SGD
        lr: 0.1
        weight_decay: 0.0005
      scheduler:
        milestones_ratio: [0.1, 0.3, 0.5]
        gamma: 0.3
  hyperparameters:
    generator_optimizer:
      name: Adam
      lr: 0.0005
    n_g_steps: 1
    n_s_steps: 5
    grad_approx_m: 1
    grad_approx_epsilon: 0.001
    batch_size: 256
evaluation:
  metrics:
    - acc_gt
    - normalized_clone_accuracy
  protocol: "evaluate student on victim test set"
reported_results:
  tables:
    - id: Table 1
      metrics:
        cifar10:
          victim_acc: 0.955
          dfme_acc: 0.881
          dfme_ratio: 0.92
        svhn:
          victim_acc: 0.962
          dfme_acc: 0.952
          dfme_ratio: 0.99
  figures:
    - id: Figure 3
      metrics:
        description: test accuracy vs query budget for SVHN and CIFAR-10
  targets:
    - id: cifar10_main
      condition: CIFAR10 DFME
      metric_name: acc_gt
      query_budget: 20000000
      paper_value: 0.881
      track: track_b
      tolerance_pp: 1.0
assumptions:
  - item: strictness gating on full-budget execution
    reason: victim now uses vendored official checkpoint; strict verdict still requires completing 20M-query full run and checking target tolerance
    impact_check: comparison remains incomplete/fail until full run artifacts are generated
evidence_index:
  - item_path: attack.query_budget.cifar10
    pdf_page: 4776
    ref: Section 5.1 Datasets and Architectures
    quote: The default query budget Q is 2M for SVHN, and 20M for CIFAR-10.
  - item_path: attack.hyperparameters.grad_approx_m
    pdf_page: 4776
    ref: Section 5.1 Datasets and Architectures
    quote: For gradient approximation we sample m = 1 random directions and a step size epsilon = 10^-3.
  - item_path: reported_results.tables[0].metrics.cifar10.dfme_acc
    pdf_page: 4777
    ref: Table 1
    quote: CIFAR10 (20M) ... DFME 88.1% (0.92x).
