run:
  name: repro_2022_sanyal_dfms_smoke2k_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: "1.2"

repro:
  victim_eval:
    enabled: true

victim:
  victim_id: cifar10_resnet18
  arch: resnet18
  input_scale_mode: unit
  channels: 3
  num_classes: 10
  input_size: [32, 32]
  checkpoint_ref: runs/victims/cifar10_resnet18_seed0.pt
  output_mode: hard_top1
  temperature: 1.0

dataset:
  name: CIFAR10
  data_mode: data_free
  channels: 3
  input_size: [32, 32]

attack:
  name: dfms
  output_mode: hard_top1
  internal_input_scale_mode: tanh
  use_official_dcgan_arch: true
  max_budget: 2000
  batch_size: 32
  oracle_batch_size: 32
  use_official_stages: true
  dcgan_epochs: 1
  student_init_epochs: 1
  degan_epochs: 1
  student_degan_epochs: 1
  alternate_epochs: 2
  student_init_lr: 0.01
  student_alt_lr: 0.01
  clone_lr: 0.01
  generator_lr: 0.0002
  discriminator_lr: 0.0002
  student_batch_size: 32
  proxy_data_ratio: 0.1
  dcgan_data_ratio: 0.1
  div_gan_data_ratio: 0.1
  proxy_pad_crop: true
  alternate_auto_augment: true
  auto_augment_policy: cifar10
  proxy_dataset:
    name: CIFAR10
    data_mode: surrogate
    surrogate_name: CIFAR100
    num_workers: 0
    train_split: true
    channels: 3
    input_size: [32, 32]
    surrogate_class_subset_size: 10
    surrogate_class_subset_seed: 42
    surrogate_class_subset_names: [plate, rose, castle, keyboard, house, forest, road, television, bottle, wardrobe]
    surrogate_max_samples: 2000
    surrogate_subset_seed: 42

substitute:
  arch: resnet18
  init_seed: 1234
  batch_size: 32
  num_workers: 0
  train_num_workers: 0
  val_num_workers: 0
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  max_epochs: 5
  patience: 2

budget:
  max_budget: 2000
  checkpoints: [200, 600, 1000, 1400, 1800, 2000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
