run:
  name: activethief_cifar10_resnet18_reproduction
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: '1.2'

victim:
  victim_id: cifar10_resnet34_8x_official
  arch: resnet34
  width_mult: 8
  channels: 3
  num_classes: 10
  input_size: [32, 32]
  checkpoint_ref: runs/victims/cifar10-resnet34_8x.pt
  output_mode: soft_prob
  temperature: 1.0

dataset:
  name: CIFAR10
  data_mode: surrogate
  surrogate_name: ImageNet
  surrogate_root: C:/imagenet
  surrogate_resize: [32, 32]
  surrogate_max_samples: 100000
  surrogate_subset_seed: 42
  channels: 3
  input_size: [32, 32]
  train_split: true

attack:
  name: activethief
  output_mode: soft_prob
  max_budget: 20000
  rounds: 10
  strategy: uncertainty
  batch_size: 150
  initial_seed_size: 2000

substitute:
  arch: resnet18  # Changed from activethief_cnn to match Victim capacity
  dropout_prob: 0.2
  width_mult: 1
  init_seed: 1234
  batch_size: 150
  
  # Track A: Train from scratch parameters
  trackA:
    batch_size: 150
  
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.001
    betas: [0.9, 0.999]
    
  max_epochs: 1000
  patience: 100

budget:
  max_budget: 20000
  checkpoints: [2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
