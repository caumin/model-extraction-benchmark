run:
  name: activethief_reproduction_cifar10_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: '1.2'

victim:
  victim_id: cifar10_resnet18
  arch: resnet18
  channels: 3
  num_classes: 10
  input_size: [32, 32]
  checkpoint_ref: runs/victims/cifar10_resnet18_seed0.pt
  output_mode: soft_prob
  temperature: 1.0

dataset:
  name: CIFAR10
  data_mode: surrogate
  surrogate_name: ImageNet
  surrogate_root: ./data/imagenet
  surrogate_resize: [32, 32]
  surrogate_max_samples: 50000
  surrogate_subset_seed: 42
  channels: 3
  input_size: [32, 32]
  train_split: true

attack:
  name: activethief
  output_mode: soft_prob
  max_budget: 20000
  rounds: 10
  strategy: uncertainty
  batch_size: 150
  initial_seed_size: 2000 # 10% of 20k

substitute:
  arch: activethief_cnn
  dropout_prob: 0.2 # CIFAR-10 specific (0.1 for others)
  init_seed: 1234
  batch_size: 150
  
  optimizer:
    name: adam
    lr: 0.001 # Default Adam LR
    weight_decay: 0.001
    betas: [0.9, 0.999] # Default Adam betas
    
  max_epochs: 1000
  patience: 100 # Early stopping patience

budget:
  max_budget: 20000
  checkpoints: [2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
