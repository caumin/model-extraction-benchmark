  name: cloudleak
  output_mode: soft_prob
  max_budget: 200
  num_rounds: 2
  initial_pool_size: 20
  candidate_ratio: 2.0
  use_full_pool: false
  batch_size: 16
  gen_batch_size: 16
  lbfgs_iters: 2
  max_epochs: 2
  patience: 2
  use_pretrained: false
substitute:
  arch: lenet_mnist
  init_seed: 1234
  batch_size: 16
  trackA:
    batch_size: 16
    steps_coeff_c: 0.2
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  max_epochs: 2
  patience: 2
budget:
  max_budget: 200
  checkpoints:
  - 200
cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
