run:
  name: smoke_cloudleak_mnist_200
  seeds:
  - 0
  device: cuda:0
benchmark:
  protocol_version: "1.2"
victim:
  victim_id: mnist_lenet
  arch: lenet_mnist
  channels: 1
  num_classes: 10
  input_size:
  - 28
  - 28
  checkpoint_ref: runs/victims/mnist_lenet_seed0.pt
  normalization: null
  output_mode: soft_prob
  temperature: 1.0
dataset:
  name: MNIST
  data_mode: surrogate
  surrogate_name: EMNIST
  train_split: true
