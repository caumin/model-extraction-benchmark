run:
  name: smoke_temp_activethief_mnist_200
  seeds:
    - 0
  device: cpu
benchmark:
  protocol_version: "1.2"
  verify_victim_accuracy: false
victim:
  victim_id: mnist_lenet
  arch: lenet_mnist
  channels: 1
  num_classes: 10
  input_size: [28, 28]
  checkpoint_ref: runs/victims/mnist_lenet_mnist_seed0.pt
  normalization: null
  output_mode: soft_prob
  temperature: 1.0
  return_outputs_on_cpu: false
dataset:
  name: MNIST
  data_mode: seed
  train_split: true
  seed_size: 500
attack:
  name: temp_activethief
  output_mode: soft_prob
  strategy: uncertainty
  max_budget: 200
  batch_size: 16
  iterations: 4
substitute:
  arch: lenet_mnist
  init_seed: 1234
  batch_size: 16
  max_epochs: 2
  patience: 2
  optimizer:
    name: adam
    lr: 0.001
budget:
  max_budget: 200
  checkpoints: [200]
cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
