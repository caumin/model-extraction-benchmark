run:
  name: smoke_dfme_mnist_200
  seeds:
  - 0
  device: cuda:0
benchmark:
  protocol_version: "1.2"
victim:
  victim_id: mnist_lenet
  arch: lenet_mnist
  channels: 1
  num_classes: 10
  input_size:
  - 28
  - 28
  checkpoint_ref: runs/victims/mnist_lenet_seed0.pt
  normalization: null
  output_mode: soft_prob
  temperature: 1.0
dataset:
  name: MNIST
  data_mode: data_free
  train_split: true
attack:
  name: dfme
  output_mode: soft_prob
  max_budget: 200
  batch_size: 16
  n_g_steps: 1
  n_s_steps: 1
  grad_approx_m: 1
  grad_approx_epsilon: 0.001
substitute:
  arch: lenet_mnist
  init_seed: 1234
  batch_size: 16
  trackA:
    batch_size: 16
    steps_coeff_c: 0.2
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
  max_epochs: 2
  patience: 2
budget:
  max_budget: 200
  checkpoints:
  - 200
cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
