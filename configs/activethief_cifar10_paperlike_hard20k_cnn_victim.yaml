run:
  name: activethief_cifar10_paperlike_hard20k_cnn_victim_seed0
  seeds: [0]
  device: cuda:0

benchmark:
  protocol_version: "1.2"

victim:
  victim_id: cifar10_activethief_cnn
  arch: activethief_cnn
  channels: 3
  num_classes: 10
  input_size: [32, 32]
  checkpoint_ref: runs/victims/cifar10_activethief_cnn_seed0.pt
  output_mode: hard_top1
  temperature: 1.0

dataset:
  name: CIFAR10
  data_mode: surrogate
  surrogate_name: ImageNet
  surrogate_root: ./data/imagenet
  surrogate_resize: [32, 32]
  surrogate_max_samples: 100000
  surrogate_subset_seed: 42
  num_workers: 8
  channels: 3
  input_size: [32, 32]
  train_split: true

attack:
  name: activethief
  output_mode: hard_top1
  max_budget: 20000
  rounds: 10
  step_size: 2000
  strategy: uncertainty
  batch_size: 150
  initial_seed_ratio: 0.1
  validation_budget_ratio: 0.2
  num_workers: 8
  pool_num_workers: 8
  train_num_workers: 4

substitute:
  arch: activethief_cnn
  dropout_prob: 0.2
  init_seed: 1234
  batch_size: 150
  num_workers: 4
  train_num_workers: 4
  val_num_workers: 4
  trackA:
    batch_size: 150
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.001
    betas: [0.9, 0.999]
  max_epochs: 1000
  patience: 100

budget:
  max_budget: 20000
  checkpoints: [2000, 4000, 6000, 8000, 10000, 12000, 14000, 16000, 18000, 20000]

cache:
  enabled: true
  policy: temporary
  delete_on_finish: true
